<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipy 收藏夹</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260512-repository-name-hitbox" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="应用标题">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">C</span>
          <div>
            <h1>Clipy 收藏夹</h1>
            <p id="entryCount">0 条收藏</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="sessionButton" class="session-button" type="button" aria-expanded="false" aria-controls="sessionPanel">
            登录状态
          </button>
          <div class="sync-pill" aria-label="本地保存状态">
            <span class="status-dot"></span>
            本地保存
          </div>
        </div>
      </header>

      <section id="sessionPanel" class="session-panel hidden" aria-label="Clipy 浏览器登录状态" hidden>
        <div class="session-panel-header">
          <div>
            <h2>Clipy 浏览器登录状态</h2>
            <p id="sessionStatus">读取 Clipy 专属浏览器 profile。</p>
          </div>
          <button id="sessionCloseButton" class="icon-button session-close" type="button" aria-label="关闭登录状态">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div id="sessionList" class="session-list"></div>
      </section>

      <div id="composerSpacer" class="composer-spacer" hidden></div>
      <section class="composer" aria-label="添加收藏">
        <div id="dropZone" class="drop-zone">
          <textarea
            id="linkInput"
            rows="1"
            placeholder="粘贴链接，或拖入文件"
            aria-label="粘贴收藏链接"
          ></textarea>
          <div id="filePreview" class="file-preview" aria-live="polite"></div>
          <input id="fileInput" type="file" multiple hidden />
          <div class="composer-actions">
            <button id="pickFilesButton" class="icon-button" type="button" aria-label="选择文件" title="选择文件">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
            <button id="addButton" class="primary-button" type="button">添加</button>
          </div>
        </div>
        <p id="notice" class="notice" role="status"></p>
      </section>

      <nav class="filters" aria-label="收藏筛选和仓库">
        <div id="filterChips" class="filter-chips">
          <button class="filter-chip active" data-filter="all" type="button">全部</button>
          <button class="filter-chip" data-filter="link" type="button">链接</button>
          <button class="filter-chip" data-filter="file" type="button">文件</button>
          <span id="repositoryChips" class="repository-chips"></span>
        </div>
        <button id="addRepositoryButton" class="repository-add-button" type="button" aria-label="添加仓库" title="添加仓库">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </nav>

      <section id="repositoryPanel" class="repository-panel hidden" aria-label="仓库内容" hidden>
        <div id="repositoryPanelHeader" class="repository-panel-header" role="button" tabindex="0" aria-expanded="false">
          <div class="repository-name-block">
            <input id="repositoryNameInput" class="repository-name-input" type="text" maxlength="80" aria-label="仓库名称" />
            <p id="repositoryMeta"></p>
          </div>
          <div class="repository-panel-actions">
            <button id="repositoryManageButton" class="secondary-button" type="button">选择内容</button>
            <button id="repositoryDoneButton" class="secondary-button hidden" type="button">完成</button>
          </div>
        </div>
        <div id="repositoryPicker" class="repository-picker hidden"></div>
      </section>

      <section class="timeline-section" aria-label="收藏时间线">
        <div id="emptyState" class="empty-state">
          <div class="empty-visual" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <h2>还没有收藏</h2>
          <p>把链接或文件放到上方，就会按时间进入这里。</p>
        </div>
        <ol id="timeline" class="timeline"></ol>
      </section>
    </main>

    <template id="fileChipTemplate">
      <span class="file-chip">
        <span class="file-chip-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z" />
            <path d="M14 2v5h5" />
          </svg>
        </span>
        <span class="file-chip-name"></span>
        <button type="button" aria-label="移除文件" title="移除文件">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </span>
    </template>

    <template id="timelineItemTemplate">
      <li class="timeline-item">
        <time class="timeline-date">
          <span class="timeline-day"></span>
          <span class="timeline-hour"></span>
        </time>
        <div class="timeline-stem" aria-hidden="true">
          <span class="timeline-dot"></span>
        </div>
        <article class="entry" tabindex="0">
          <div class="entry-content">
            <div class="entry-main">
              <span class="source-icon" aria-hidden="true"></span>
              <div class="entry-copy">
                <h2></h2>
                <p class="entry-meta"></p>
              </div>
            </div>
            <div class="entry-details" hidden></div>
          </div>
          <div class="entry-actions">
            <button class="entry-action entry-rename" type="button" aria-label="重命名收藏" title="重命名收藏">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <button class="entry-action entry-delete" type="button" aria-label="删除收藏" title="删除收藏">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M6 6l1 16h10l1-16" />
                <path d="M10 11v6M14 11v6" />
              </svg>
            </button>
          </div>
        </article>
      </li>
    </template>

    <script type="module" src="./app.js?v=20260512-repository-name-hitbox"></script>
  </body>
</html>
